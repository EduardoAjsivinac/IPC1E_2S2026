<!DOCTYPE html>
<html lang='es'>
<head><meta charset='UTF-8'><title>Bitácora de Acciones</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f8f9fa; }
h1 { color: #1b5e20; border-bottom: 2px solid #1b5e20; padding-bottom: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
th, td { border: 1px solid #dddddd; padding: 12px; text-align: left; }
th { background-color: #1b5e20; color: white; }
tr:nth-child(even) { background-color: #f2f2f2; }
</style></head><body>
<h1>Bitácora de Acciones</h1>
<table>
<tr><th>Fecha / Hora</th><th>Usuario</th><th>Módulo</th><th>Tipo Evento</th><th>Descripción / Motivo</th></tr>
</table></body></html>
