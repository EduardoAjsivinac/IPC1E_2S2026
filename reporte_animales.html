<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Animales</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { color: #333; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Reporte General de Animales - Centro de Rescate</h1>
    <table>
        <tr>
            <th>Código</th>
            <th>Especie</th>
            <th>Edad (años)</th>
            <th>Estado Clínico</th>
            <th>Estado Adopción</th>
        </tr>
        <tr>
            <td>A-014</td>
            <td>Perro golden</td>
            <td>3</td>
            <td>APTO</td>
            <td>ADOPTADO</td>
        </tr>
        <tr>
            <td>A-009</td>
            <td>Gato</td>
            <td>0</td>
            <td>APTO</td>
            <td>DISPONIBLE</td>
        </tr>
    </table>
</body>
</html>
